    <h1>Howdy :)</h1>

	  </select>
	  <button id="setup::reload-serialport-options">Reload Options</button> <br />
	  <button id="setup::init-engine-comms">Initialize Engine Communication</button> <br />

      <label for="solenoid-1">Solenoid Valve 1</label>

    <input type="checkbox" id="motorized-1">

    <input type="checkbox" id="motorized-2">
      <label for="motorized-2">Motorized Valve 2</label>
